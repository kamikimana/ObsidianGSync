name: One-time dependency remediation

on:
  push:
    branches:
      - fix/sync-safety-20261110
    paths:
      - .github/workflows/dependency-update-once.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes to lockfile
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "npm audit fix failed unexpectedly: $status" >&2
            exit "$status"
          fi
          git diff --stat -- package.json package-lock.json
      - name: Validate resulting dependency tree
        run: |
          npm ci
          npm test
          npm run build
          npm run lint
          npm audit --omit=dev --audit-level=moderate
      - name: Record remaining audit findings
        shell: bash
        run: |
          status=0
          npm audit --json > audit-report.json || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          node -e 'const r=require("./audit-report.json"); console.log(JSON.stringify(r.metadata?.vulnerabilities || {}));'
      - name: Commit verified lockfile updates
        shell: bash
        run: |
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible audit fixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): apply compatible npm audit fixes"
          git push origin HEAD:fix/sync-safety-20261110
